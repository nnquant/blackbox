services:
  blackbox:
    build:
      context: .
    image: blackbox:local
    depends_on:
      postgres:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully
    environment:
      BLACKBOX_DATABASE_URL: postgresql+psycopg://blackbox:blackbox@postgres:5432/blackbox
      BLACKBOX_DATA_DIR: /data
      BLACKBOX_AUTH_ENABLED: ${BLACKBOX_AUTH_ENABLED:-0}
      BLACKBOX_API_TOKEN: ${BLACKBOX_API_TOKEN:-}
      BLACKBOX_ARTIFACT_STORAGE: ${BLACKBOX_ARTIFACT_STORAGE:-s3}
      BLACKBOX_S3_BUCKET: ${BLACKBOX_S3_BUCKET:-blackbox}
      BLACKBOX_S3_ENDPOINT_URL: http://minio:9000
      BLACKBOX_S3_ACCESS_KEY_ID: ${BLACKBOX_S3_ACCESS_KEY_ID:-minioadmin}
      BLACKBOX_S3_SECRET_ACCESS_KEY: ${BLACKBOX_S3_SECRET_ACCESS_KEY:-minioadmin}
      BLACKBOX_S3_PREFIX: ${BLACKBOX_S3_PREFIX:-blackbox}
    ports:
      - "8000:8000"
    volumes:
      - blackbox-data:/data
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: blackbox
      POSTGRES_USER: blackbox
      POSTGRES_PASSWORD: blackbox
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blackbox -d blackbox"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${BLACKBOX_S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${BLACKBOX_S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  create-bucket:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${BLACKBOX_S3_ACCESS_KEY_ID:-minioadmin} ${BLACKBOX_S3_SECRET_ACCESS_KEY:-minioadmin}; do sleep 1; done;
      mc mb --ignore-existing local/${BLACKBOX_S3_BUCKET:-blackbox};
      "

volumes:
  blackbox-data:
  postgres-data:
  minio-data:
